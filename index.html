<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Form Validation</title>
        <script src="index.js" defer></script>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <form novalidate class="form" action="">
            <div class="emailDiv">
                <label for="mail">Please provide your Email: </label>
                <input type="email" required name="mail" id="mail">
            </div>
            <div class="passwordDiv">
                <label for="password">Please provide your password: </label>
                <input type="password" name="password" id="password" required minlength="8">
            </div>

            <div class="confirmPswdDiv">
                <label for="confirmPassword">Please confirm Your password: </label>
                <input type="password" name="confirmPsw" id="confirmPassword" required minlength="8">
                <span class="passwordSuccess"></span>
            </div>

            <div class="countryDiv">
                <label for="country">Please provide name of your country: </label>
                <select name="country" id="country" required>
                    <option value="DZ">Algeria </option>
                    <option value="US">Uited States</option>
                    <option value="AU">Australia</option>
                    <option value="BE">Belgium</option>
                    <option value="CA">Canada</option>
                    <option value="CN">China</option>
                    <option value="ES">Spain</option>
                    <option value="ET">Ethiopia</option>
                    <option value="GE">Georgia</option>
                    <option value="KE">Kenya</option>
                </select>
            </div>

            <div class="postalCodesDiv">
                <label for="postalCode">Enter your country's postal code</label>
                <input type="text" name="postalcode" id="postalCode" required>
            </div>

            

            <button type="submit" class="submitBtn">Submit</button>
            
        </form>
    </body>
</html>
